<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Received | The Remodel Advisor</title>
  <meta name="description" content="Thanks for your order from Ted's woodworking shop.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1e3b33">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="woodworking">
  <div id="site-header"></div>
  <script src="js/components.js"></script>

  <main id="main">
    <section class="section">
      <div class="container container--narrow center">
        <p class="eyebrow">Order received</p>
        <h1>Thanks, your order is in.</h1>
        <p class="lede" id="next-step">Square has emailed your receipt. I'll email you when your piece ships.</p>
        <div class="btn-row" style="justify-content:center;margin-top:32px">
          <a class="btn" href="/woodworking#shop">Back to the Shop <span data-icon="arrow"></span></a>
          <a class="btn btn--ghost" href="/services">Remodel Consulting</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script>
    if (new URLSearchParams(location.search).get("delivery") === "pickup") {
      document.getElementById("next-step").textContent =
        "Square has emailed your receipt. I'll contact you shortly to set up pickup or delivery around Greater Cincinnati.";
    }
  </script>
</body>
</html>
